name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    # Pinned: ubuntu-latest moves to Ubuntu 26.04 from 2026-10-19; change the image on purpose.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
